<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff4ef">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Our First Chapter</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Jost:wght@300;400&family=La+Belle+Aurore&display=swap" rel="stylesheet">
<style>
:root{--mid:#0d0509;--bur:#3a0d1c;--wine:#6b1630;--rose:#c4566e;--blush:#f0b8c0;--peach:#f7d9c8;--cream:#f6ecdc;--champ:#e8d3a8;--ink:#3b2028;
--serif:"Cormorant Garamond",Georgia,serif;--sans:"Jost",system-ui,sans-serif;--hand:"La Belle Aurore","Snell Roundhand",cursive;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;height:auto}
body{background:var(--mid);color:var(--cream);font:300 1.05rem/1.7 var(--sans);overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1}
section{min-height:100svh;padding:14vh 6vw;position:relative;display:flex;flex-direction:column;align-items:center}
h1,h2,h3{font-family:var(--serif);font-weight:300;line-height:1.1}
h2{font-size:clamp(2.2rem,7vw,4.6rem);text-align:center;margin-bottom:.4em}
.hand{font-family:var(--hand);color:var(--blush)}
.chap{font-family:var(--serif);font-style:italic;color:var(--champ);opacity:.8;margin-bottom:1rem;letter-spacing:.08em}
.sub{max-width:34ch;text-align:center;opacity:.75;margin-bottom:3rem}
.rv{opacity:0;transform:translateY(24px);transition:opacity 1.4s ease,transform 1.4s ease}
.rv.in{opacity:1;transform:none}
/* hero */
#hero{justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 55%,rgba(140,30,60,.4),transparent 60%);transition:opacity 1.6s,filter 1.6s}
#hero .glow{position:absolute;width:min(70vw,460px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(196,86,110,.35),transparent 65%);animation:beat 4.5s ease-in-out infinite;z-index:-1}
@keyframes beat{50%{transform:scale(1.15);opacity:.6}}
#hero .hand{font-size:clamp(1.2rem,4vw,1.7rem);margin-bottom:1.4rem}
#hero h1{font-size:clamp(3.4rem,15vw,9rem);font-style:italic;text-shadow:0 0 60px rgba(196,86,110,.5)}
#hero p.d{font-family:var(--serif);font-size:clamp(1.3rem,4vw,2rem);color:var(--champ);margin:.6rem 0 2.6rem}
#hero .l{opacity:0;animation:up 2s ease forwards}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1}}
.btn{font:400 1rem var(--sans);letter-spacing:.12em;color:var(--cream);background:rgba(107,22,48,.5);border:1px solid rgba(240,184,192,.5);border-radius:99px;padding:1.05rem 2.4rem;cursor:pointer;backdrop-filter:blur(8px);box-shadow:0 0 30px rgba(196,86,110,.35);transition:.5s;min-height:48px}
.btn:hover{box-shadow:0 0 55px rgba(196,86,110,.7);background:rgba(140,30,60,.65);letter-spacing:.18em}
body.locked main>section:not(#hero),body.locked nav{display:none}
/* nav */
nav{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:14px}
nav a{width:8px;height:8px;border-radius:50%;background:rgba(240,184,192,.35);transition:.4s;display:block;position:relative}
nav a:hover,nav a.on{background:var(--blush);box-shadow:0 0 10px var(--rose);transform:scale(1.4)}
nav a::before{content:"";position:absolute;inset:-10px}
/* scrapbook timeline */
.scrap{width:100%;max-width:900px;display:flex;flex-direction:column;gap:4rem}
.mem{display:flex;gap:1.6rem;align-items:center}
.mem:nth-child(even){flex-direction:row-reverse}
.pol{background:#fbf4ea;padding:10px 10px 38px;width:min(44vw,240px);flex:none;box-shadow:0 20px 40px rgba(0,0,0,.5);transform:rotate(var(--r,-3deg));transition:.6s cubic-bezier(.2,.8,.2,1);position:relative;cursor:default}
.pol::before{content:"";position:absolute;top:-12px;left:50%;width:70px;height:22px;background:rgba(232,211,168,.6);transform:translateX(-50%) rotate(-2deg)}
.mem:hover .pol{transform:rotate(0) scale(1.05) translateY(-6px)}
.ph{aspect-ratio:1;background-size:cover;background-position:center;display:grid;place-items:center;font-size:2rem;color:rgba(255,255,255,.5)}
.pol .cap{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-family:var(--hand);color:var(--ink);font-size:.95rem}
.note{background:rgba(255,255,255,.05);border:1px solid rgba(240,184,192,.2);backdrop-filter:blur(10px);padding:1.4rem;border-radius:4px;flex:1}
.note .dt{font-family:var(--hand);color:var(--blush);font-size:1.15rem}
.note h3{font-size:1.7rem;margin:.2rem 0 .4rem;font-style:italic}
.note p{opacity:.75;font-size:.95rem}
@media(max-width:600px){.mem,.mem:nth-child(even){flex-direction:column}.pol{width:62vw}}
/* gallery */
.table{position:relative;width:100%;max-width:1000px;display:flex;flex-wrap:wrap;justify-content:center}
.table .pol{margin:-14px -8px;cursor:pointer;width:min(42vw,250px)}
.table .pol:hover{z-index:3;transform:rotate(0) scale(1.08)}
@media(max-width:700px){.table{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;padding:2rem 10vw;width:100vw;margin:0 -6vw;-webkit-overflow-scrolling:touch}.table .pol{flex:none;width:72vw;scroll-snap-align:center;margin:0}}
#lb{position:fixed;inset:0;z-index:20;background:rgba(13,5,9,.92);backdrop-filter:blur(14px);display:none;place-items:center;padding:5vw;opacity:0;transition:opacity .6s}
#lb.show{display:grid}#lb.vis{opacity:1}
#lb .in{display:flex;gap:2.4rem;align-items:center;max-width:900px;max-height:90svh;overflow:auto}
#lb .pol{width:min(80vw,380px);transform:rotate(-2deg);cursor:default}
#lb .msg{max-width:32ch}
#lb .msg .hand{font-size:1.3rem}#lb h3{font-style:italic;font-size:2rem;margin:.3rem 0}
#lb blockquote{font-family:var(--serif);font-style:italic;font-size:1.3rem;color:var(--peach);margin-top:1rem}
.x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:18px;background:none;border:0;color:var(--cream);font-size:2rem;cursor:pointer;width:48px;height:48px}
@media(max-width:700px){#lb .in{flex-direction:column;gap:1.4rem}}
/* love notes */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:1.4rem;width:100%;max-width:960px}
.card{perspective:900px;height:190px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card .f{position:relative;height:100%;transition:transform 1s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.card.open .f{transform:rotateX(180deg)}
.card .a,.card .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:4px;display:grid;place-items:center;text-align:center;padding:1.4rem}
.card .a{background:linear-gradient(145deg,var(--wine),var(--bur));border:1px solid rgba(240,184,192,.3);font:italic 1.5rem var(--serif);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.card .a::after{content:"";position:absolute;bottom:14px;width:9px;height:9px;background:var(--rose);border-radius:50%;box-shadow:0 0 14px var(--rose)}
.card .b{background:var(--cream);color:var(--ink);transform:rotateX(180deg);font:1.1rem/1.4 var(--hand);box-shadow:0 0 40px rgba(240,184,192,.3)}
.card:hover .a{border-color:var(--blush)}
/* record */
.rec{display:flex;flex-direction:column;align-items:center;gap:1.6rem;text-align:center}
.vinyl{width:min(72vw,300px);aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#160a0f 0 2px,#22101a 3px 4px);position:relative;box-shadow:0 30px 60px rgba(0,0,0,.6);animation:spin 6s linear infinite;animation-play-state:paused;transition:box-shadow 1s}
.vinyl::after{content:"";position:absolute;inset:32%;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--mid) 0 6%,transparent 7%),linear-gradient(135deg,var(--rose),var(--wine))}
.playing .vinyl{animation-play-state:running;box-shadow:0 0 90px rgba(196,86,110,.5)}
@keyframes spin{to{transform:rotate(360deg)}}
.wave{display:flex;gap:4px;height:26px;align-items:center}.wave i{width:3px;height:6px;background:var(--blush);border-radius:2px}
.playing .wave i{animation:w 1s ease-in-out infinite}.wave i:nth-child(2n){animation-delay:.25s!important}.wave i:nth-child(3n){animation-delay:.5s!important}
@keyframes w{50%{height:24px}}
.rec h3{font-size:2rem;font-style:italic}
.url{background:transparent;border:0;border-bottom:1px solid rgba(240,184,192,.3);color:var(--cream);font:.8rem var(--sans);text-align:center;width:min(80vw,320px);padding:.4rem;opacity:.5}
/* letter */
#letter{background:linear-gradient(var(--mid),#2a1420 8%,#2a1420 92%,var(--mid))}
.paper{background:var(--cream);background-image:radial-gradient(rgba(120,80,60,.06) 1px,transparent 1px);background-size:5px 5px;color:var(--ink);max-width:640px;width:100%;padding:clamp(2rem,7vw,4.5rem);box-shadow:0 40px 80px rgba(0,0,0,.6),inset 0 0 80px rgba(180,140,100,.2);transform:rotate(-.6deg);position:relative}
.paper h3{font:1.9rem var(--hand);color:var(--wine);margin-bottom:1.6rem;line-height:1.5}
.paper p{font:1.3rem/1.85 var(--serif);margin-bottom:1.1rem;opacity:0;transform:translateY(8px);transition:1.6s}
.paper p.in{opacity:1;transform:none}
.paper p.hd{font:1.5rem/1.7 var(--hand);color:var(--wine)}
.sign{font:1.9rem var(--hand);color:var(--wine);margin-top:1.4rem}
.petal{position:absolute;width:22px;height:30px;background:radial-gradient(circle at 30% 30%,var(--rose),var(--wine));border-radius:60% 0 60% 0;opacity:.7}
/* future + bucket */
.list{list-style:none;padding:0;width:100%;max-width:480px}
.list li{display:flex;align-items:center;gap:1rem;padding:1rem 0;border-bottom:1px solid rgba(240,184,192,.15);cursor:pointer;font:1.3rem var(--serif);position:relative;min-height:56px}
.list .box{width:22px;height:22px;border:1px solid var(--blush);border-radius:50%;flex:none;display:grid;place-items:center;transition:.5s;font-size:.8rem;color:transparent}
.list li.done .box{background:var(--rose);color:#fff;box-shadow:0 0 16px var(--rose)}
.list li.done span{opacity:.55;text-decoration:line-through;text-decoration-color:var(--rose)}
.fl{position:absolute;left:8px;pointer-events:none;font-size:.9rem;color:var(--blush);animation:fl 1.6s ease-out forwards}
@keyframes fl{to{transform:translateY(-60px) translateX(var(--dx));opacity:0}}
/* secret */
.sec{position:absolute;width:26px;height:26px;background:none;border:0;cursor:pointer;color:var(--rose);font-size:.9rem;opacity:.18;animation:tw 3s infinite;z-index:4}
.sec:hover{opacity:1}@keyframes tw{50%{opacity:.5}}
#toast{position:fixed;left:50%;bottom:8vh;transform:translate(-50%,20px);z-index:30;background:rgba(58,13,28,.92);border:1px solid var(--blush);backdrop-filter:blur(12px);padding:1.4rem 1.8rem;border-radius:6px;max-width:min(90vw,420px);text-align:center;opacity:0;pointer-events:none;transition:.9s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast b{display:block;font:italic 1.1rem var(--serif);color:var(--champ);margin-bottom:.4rem;font-weight:300}
#toast span{font:1.25rem var(--hand);color:var(--peach)}
/* final */
#final{background:linear-gradient(var(--mid),var(--bur) 60%,#1a0710);justify-content:center;text-align:center}
.stage{min-height:40svh;display:grid;place-items:center;width:100%}
.ln{grid-area:1/1;opacity:0;transition:opacity 2s;font:italic 300 clamp(1.5rem,5.5vw,2.6rem)/1.3 var(--serif);max-width:20ch}
.ln.on{opacity:1}
.ln.big{font-size:clamp(3rem,13vw,7rem);font-style:italic;max-width:none;text-shadow:0 0 50px rgba(196,86,110,.6)}
.ln.hand{font:clamp(1.8rem,7vw,3rem) var(--hand)}
.hrt{width:22px;height:22px;background:var(--rose);transform:rotate(45deg);position:relative;margin:2rem auto 0;animation:beat2 2.8s ease-in-out infinite;box-shadow:0 0 30px var(--rose);opacity:0;transition:opacity 3s}
.hrt::before,.hrt::after{content:"";position:absolute;width:22px;height:22px;background:var(--rose);border-radius:50%}
.hrt::before{left:-11px}.hrt::after{top:-11px}
.hrt.on{opacity:1}
@keyframes beat2{50%{transform:rotate(45deg) scale(1.2)}}
#replay{margin-top:2rem;opacity:0;pointer-events:none;transition:opacity 2s}#replay.on{opacity:1;pointer-events:auto}
.pl{font-family:var(--hand);color:var(--blush);text-align:center;margin-top:3rem;opacity:.7}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}html{scroll-behavior:auto}}
/* LIGHT + CUTE THEME */
:root{--mid:#fff4ef;--txt:#5a2033}
body{background:linear-gradient(180deg,#fff4ef,#fde3e6 45%,#fff0e6);color:var(--txt)}
.hand{color:var(--rose)}.chap{color:var(--rose)}h2{color:var(--wine)}
h2::after{content:"♡";display:block;font-size:1.3rem;color:var(--rose);margin-top:.3rem;animation:bob 3s ease-in-out infinite}
#hero h1{color:var(--wine);text-shadow:0 0 50px rgba(255,150,170,.6)}#hero p.d{color:var(--rose)}
.btn,.btn:hover{color:#fff}.btn{background:linear-gradient(135deg,#e88aa0,#c4566e);border-color:transparent;box-shadow:0 10px 26px rgba(196,86,110,.35)}
.btn:hover{background:linear-gradient(135deg,#f099ad,#d0607a);box-shadow:0 14px 34px rgba(196,86,110,.5);transform:scale(1.05)}.btn:active{transform:scale(.95)}
.stk{position:absolute;font-size:clamp(1.6rem,5vw,2.6rem);animation:bob 5s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(196,86,110,.25));pointer-events:none}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes bobp{50%{transform:translateY(-6px) rotate(calc(var(--r,-3deg) + 1.5deg))}}
.pol:not(:hover){animation:bobp 6s ease-in-out infinite}
.mem:nth-child(2n) .pol,.table>div:nth-child(2n) .pol{animation-delay:-2s}.table>div:nth-child(3n) .pol{animation-delay:-4s}
.pol{box-shadow:0 14px 30px rgba(140,60,80,.25);background:#fff}
.pol::before{background:rgba(255,190,205,.75)}
.ph.empty{background:linear-gradient(135deg,#ffe6ea,#fdd1da);border:2px dashed #e39aab;color:var(--rose);font:.95rem/1.4 var(--hand)}
.note{background:rgba(255,255,255,.75);border:1px solid rgba(196,86,110,.25);color:var(--txt)}
#lb{background:rgba(255,240,240,.93)}.x,.url{color:var(--txt)}.url{border-bottom-color:rgba(196,86,110,.4)}
.card .a{background:linear-gradient(145deg,#ffe3e8,#fbc9d3);color:var(--wine);border-color:rgba(196,86,110,.3);box-shadow:0 10px 24px rgba(196,86,110,.2)}
.card .b{box-shadow:0 8px 24px rgba(196,86,110,.25)}
@keyframes wig{25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
.card:not(.open):hover{animation:wig .6s}
.wave i{background:var(--rose)}
#letter{background:linear-gradient(var(--mid),#fbd9de 8%,#fbd9de 92%,var(--mid))}
.list li{border-bottom-color:rgba(196,86,110,.2)}.list .box{border-color:var(--rose)}
@keyframes pop{40%{transform:scale(1.5)}}.list li.done .box{animation:pop .5s}.fl{color:var(--rose)}
#toast{background:rgba(255,250,248,.96);border-color:var(--rose);color:var(--txt);box-shadow:0 10px 30px rgba(196,86,110,.25)}#toast b{color:var(--rose)}#toast span{color:var(--wine)}
#final{background:linear-gradient(var(--mid),#fbd5dc 60%,#f7bfcb)}
.ln{color:#7a1f3d}.ln.big{text-shadow:0 0 40px rgba(255,255,255,.9)}.pl{color:var(--rose)}
nav a{background:rgba(196,86,110,.35)}nav a:hover,nav a.on{background:#c4566e;box-shadow:0 0 10px rgba(196,86,110,.6)}
/* round photo instead of record */
.vinyl{background:#fff;background-size:cover;background-position:center;border:6px solid #fff;box-shadow:0 20px 50px rgba(196,86,110,.35)}
.vinyl::after{display:none}
.playing .vinyl{box-shadow:0 0 70px rgba(232,110,140,.6)}
.vinyl.empty{animation:none;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#ffe6ea,#fdd1da);border:3px dashed #e39aab;color:var(--rose);font:1.1rem/1.5 var(--hand)}
/* MOBILE OPTIMIZATIONS */
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
button,.card,.list li,.pol{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
section{min-height:100vh;min-height:100svh}
.ph{overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover;display:block}
#toast{bottom:calc(8vh + env(safe-area-inset-bottom,0px))}
@media(hover:none){.mem:hover .pol,.table .pol:hover{transform:rotate(var(--r,-3deg))}.btn:hover{transform:none}.card:not(.open):hover{animation:none}}
@media(max-width:700px){
 section{padding:11vh 5vw}
 nav{display:none}
 .btn,.note,#lb,#toast{-webkit-backdrop-filter:none;backdrop-filter:none}
 #enter,#play{min-width:210px}
 .url{font-size:16px}
 .table{width:100vw;margin:0;padding:2rem 12vw 2.5rem;scrollbar-width:none;overscroll-behavior-x:contain}
 .table::-webkit-scrollbar{display:none}
 .paper p{font-size:1.15rem}.paper p.hd{font-size:1.3rem}
 .card{height:clamp(150px,42vw,190px)}
 .list li{font-size:1.15rem}
 .ln{max-width:16ch}
 #lb .in{padding-bottom:2rem}
}
:root[data-theme="light"]{color-scheme:light}
</style></head>

      {t:"Ishamma nijamga assalu nenu naa life lo intha happy ga unna year edhaina undhi antey adhi idhey ishamma nenu ee one year ni neetho time spend chesina prathi moment naaku chaalu antey chaala special ishamma. Naaku ee year naa birthday ki ichina surprise matram naaku one of the unforgottable moment babe.Ee one year manam chaala chusam idharam godavapaddam idharam navvukunam kaani enni jerigina nuv nenu eppatiki ilane untam ishamma nenu enni problems vachina ninnu vadhulukon babe.... and your are always my first baby ishaamma."},
      {t:"Thank you for your patience, your laugh, and for choosing me on the days I was hard to choose.", hand:true},
      {t:"I don't need a perfect future. I just want more of this: you, me, and the small moments we make into ours."}
    ],
    closing: "Always yours,"
  },
  BUCKET_LIST: ["Travel somewhere together","Watch a sunrise","Take a spontaneous trip","Try something completely new","Celebrate anniversary #2","Make another hundred memories","Grow together"],
  SECRET_MESSAGES: [
    "You found something I didn't tell you about… I practiced what to say to you for weeks.",
    "Second secret: the first time you laughed at my joke, I decided to stay.",
    "Last one: I keep every little thing you've ever sent me."
  ],
  FINAL_MESSAGE: {
    lines: ["And most importantly…","I want you to know something.","If I had to live this year all over again…","I'd still choose every moment with you."],
    after: ["Happy 1st Anniversary.","Thank you for being my favorite chapter.","I love you."]
  }
};
/* ========== END OF EDITABLE CONTENT ========== */

const C=CONFIG,$=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const ph=(p,i)=>p.src?`<div class="ph"><img src="${p.src}" alt="${p.caption||'Our photo'}" loading="lazy" decoding="async"></div>`:`<div class="ph empty"><span>📷<br>our photo<br>goes here</span></div>`;
const pol=(p,i,cap)=>`<div class="pol" style="--r:${[-4,3,-2,4,-3][i%5]}deg">${ph(p,i)}<div class="cap">${cap??p.caption}</div></div>`;
const chapter=(id,n,t)=>`<div class="chap rv">Chapter ${n}</div><h2 class="rv">${t}</h2>`;

$('#app').innerHTML=`
<section id="hero"><div class="glow"></div><span class="stk" style="top:14%;left:10%">🎀</span><span class="stk" style="top:22%;right:12%;animation-delay:-2s">🌸</span><span class="stk" style="bottom:20%;left:14%;animation-delay:-1s">🧸</span><span class="stk" style="bottom:16%;right:10%;animation-delay:-3s">✨</span><span class="stk" style="top:48%;left:5%;animation-delay:-4s">💗</span><span class="stk" style="top:8%;right:38%;animation-delay:-2.5s">☁️</span>
 <p class="hand l" style="animation-delay:.6s">For the girl who made this year unforgettable…</p>
 <h1 class="l" style="animation-delay:1.8s">Our First Chapter</h1>
 <p class="d l" style="animation-delay:3s">365 days of us.</p>
 <p class="l" style="animation-delay:4s;opacity:.7;margin-bottom:1.6rem">I made something for you.</p>
 <button class="btn l" id="enter" style="animation-delay:5s">Enter Our Story ❤️</button></section>

<section id="c1">${chapter('c1','One','The Beginning')}
 <div class="scrap">${C.TIMELINE_EVENTS.map((e,i)=>`<div class="mem rv">${pol(C.PHOTOS[e.photo]||{},i,'')}<div class="note"><h3>${e.title}</h3><p>${e.text}</p></div></div>`).join('')}</div></section>

<section id="c2">${chapter('c2','Two','Our Memories')}<p class="sub rv">Tap any photograph.</p>
 <div class="table rv">${C.PHOTOS.map((p,i)=>`<div data-i="${i}" style="display:contents">${pol(p,i)}</div>`).join('')}</div></section>

<section id="c3">${chapter('c3','Three','Things I secretly love about you.')}<p class="sub rv">Open them, one by one.</p>
 <div class="cards">${C.LOVE_REASONS.map(r=>`<div class="card rv" tabindex="0"><div class="f"><div class="a">${r.t}</div><div class="b">${r.n}</div></div></div>`).join('')}</div></section>

<section id="c4">${chapter('c4','Four','Our Soundtrack')}
 <div class="rec rv" id="rec"><div class="vinyl ${C.SONG_PHOTO?'':'empty'}" style="${C.SONG_PHOTO?`background-image:url('${C.SONG_PHOTO}')`:''}">${C.SONG_PHOTO?'':'<span>📷<br>our photo<br>goes here</span>'}</div><div><h3>${C.SONG.title}</h3><div style="opacity:.6">${C.SONG.artist}</div></div>
 <div class="wave">${'<i></i>'.repeat(9)}</div><button class="btn" id="play">Play</button>
 <input class="url" ${C.SONG_URL?'hidden':''} id="url" placeholder="Paste song URL (mp3)" value="${C.SONG_URL}" aria-label="Song URL"></div></section>

<section id="letter">${chapter('c5','Five','A letter I wish I could hand to you.')}
 <div class="paper rv" id="paper"><span class="petal" style="top:-8px;right:12%;transform:rotate(30deg)"></span><span class="petal" style="bottom:-6px;left:9%;transform:rotate(-40deg);opacity:.5"></span>
 <h3>${C.LOVE_LETTER.greeting}</h3>${C.LOVE_LETTER.paragraphs.map(p=>`<p class="${p.hand?'hd':''}">${p.t}</p>`).join('')}
 <p class="sign">${C.LOVE_LETTER.closing}<br>${C.MY_NAME} ❤️</p></div></section>

<section id="c6">${chapter('c6','Six','And this is only the beginning…')}
 <p class="sub rv">Tick them off as we go.</p><ul class="list rv">${C.BUCKET_LIST.map(b=>`<li><div class="box">✓</div><span>${b}</span></li>`).join('')}</ul>
 <button class="sec" id="s2" style="bottom:12vh;left:6vw" aria-label="A tiny glowing heart">♥</button></section>

<section id="final"><div class="stage" id="stage">
 ${C.FINAL_MESSAGE.lines.map(l=>`<div class="ln">${l}</div>`).join('')}
 <div class="ln big">${C.HER_NAME}❤️</div>
 ${C.FINAL_MESSAGE.after.map((l,i)=>`<div class="ln ${i==2?'big':''}" ${i==2?'style="font-size:clamp(2.6rem,10vw,5rem)"':''}>${l}</div>`).join('')}
 </div><div class="hrt" id="hrt"></div><button class="btn" id="replay">Watch again</button>
 <p class="pl">Made with love, just for one and only you.</p></section>`;

/* nav */
const secs=$$('main>section');
$('#nav').innerHTML=secs.map((s,i)=>i?`<a href="#${s.id}" aria-label="Chapter ${i}"></a>`:'').join('');

/* reveal + nav highlight */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');}}),{threshold:.1});
const observeAll=()=>$$('.rv').forEach(el=>io.observe(el));
const io2=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)$$('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#'+e.target.id))}),{threshold:.5});
secs.forEach(s=>io2.observe(s));

/* enter: cinematic fade */
$('#enter').onclick=()=>{
  $('#hero').style.cssText+=';opacity:0;filter:blur(14px)';
  setTimeout(()=>{document.body.classList.remove('locked');$('#hero').style.display='none';scrollTo(0,0);observeAll();
   setTimeout(()=>$$('.rv',$('#c1')).forEach(e=>e.classList.add('in')),100)},1500);
};

/* lightbox */
const lb=$('#lb');
$$('[data-i]').forEach(w=>w.onclick=()=>{const p=C.PHOTOS[w.dataset.i],i=+w.dataset.i;
  $('.in',lb).innerHTML=pol(p,i,p.caption)+`<div class="msg"><h3>${p.caption}</h3><blockquote>“${p.message}”</blockquote></div>`;
  lb.classList.add('show');document.body.style.overflow='hidden';requestAnimationFrame(()=>lb.classList.add('vis'))});
const closeLb=()=>{document.body.style.overflow='';lb.classList.remove('vis');setTimeout(()=>lb.classList.remove('show'),600)};
$('.x',lb).onclick=closeLb;lb.onclick=e=>{if(e.target==lb)closeLb()};addEventListener('keydown',e=>e.key=='Escape'&&closeLb());

/* love notes */
$$('.card').forEach(c=>{const t=()=>{c.classList.toggle('open');if(c.classList.contains('open'))burst(c)};c.onclick=t;c.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();t()}}});
function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<7;i++)pets.push({x:r.left+r.width/2,y:r.top+r.height/2,vx:(Math.random()-.5)*3,vy:-Math.random()*2-.5,s:5+Math.random()*5,r:Math.random()*6,life:120,fall:1,h:1})}

/* music */
const aud=$('#aud'),rec=$('#rec');
$('#play').onclick=()=>{
  const u=$('#url').value.trim();
  if(!u){toast('No song yet','Paste an audio URL below the record to play your song.');return}
  if(aud.src!==new URL(u,location.href).href)aud.src=u;
  aud.paused?aud.play().catch(()=>toast('Couldn’t play that link','Check the URL points to an audio file.')):aud.pause();
};
aud.onplay=()=>{rec.classList.add('playing');$('#play').textContent='Pause';boost=1};
aud.onpause=aud.onended=()=>{rec.classList.remove('playing');$('#play').textContent='Play';boost=0};

/* letter reveal */
new IntersectionObserver((es,o)=>es.forEach(e=>{if(e.isIntersecting){$$('p',e.target).forEach((p,i)=>setTimeout(()=>p.classList.add('in'),1200+i*1800));o.disconnect()}}),{threshold:.35}).observe($('#paper'));

/* bucket list */
$$('.list li').forEach(li=>li.onclick=()=>{li.classList.toggle('done');if(li.classList.contains('done')){for(let i=0;i<4;i++){const f=document.createElement('i');f.className='fl';f.textContent='♡';f.style.setProperty('--dx',(Math.random()*60-10)+'px');f.style.left=(6+Math.random()*30)+'px';li.appendChild(f);setTimeout(()=>f.remove(),1700)}}});

/* secrets: hero-adjacent glow heart in Chapter 6, "Our Song" title, and signature */
let sIdx=0;const secret=()=>{toast('Hidden surprise '+(Math.min(sIdx+1,3))+' of 3',C.SECRET_MESSAGES[sIdx%C.SECRET_MESSAGES.length]);sIdx++};
$('#s2').onclick=e=>{e.currentTarget.style.display='none';secret()};
const s1=document.createElement('button');s1.className='sec';s1.textContent='♥';s1.setAttribute('aria-label','A tiny glowing heart');s1.style.cssText='top:10vh;right:8vw';$('#c3').appendChild(s1);s1.onclick=()=>{s1.style.display='none';secret()};
$('.sign').onclick=()=>secret();$('.sign').style.cursor='pointer';
let tt;function toast(a,b){const t=$('#toast');$('b',t).textContent=a;$('span',t).textContent=b;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),5200)}
$('#toast').onclick=()=>$('#toast').classList.remove('show');

/* final scene */
const lns=$$('.ln'),hrt=$('#hrt'),rep=$('#replay');let ran=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function finale(){for(const l of lns){l.classList.add('on');await wait(l.classList.contains('big')?3600:3300);if(l!==lns[lns.length-1]){l.classList.remove('on');await wait(2000)}}hrt.classList.add('on');rep.classList.add('on');for(let i=0;i<14;i++)setTimeout(()=>pets.push({x:Math.random()*W,y:H+10,vx:0,vy:-1.4,s:8+Math.random()*8,r:Math.random()*6,life:400,fall:1,h:1}),i*300)}
new IntersectionObserver((es,o)=>es.forEach(e=>{if(e.isIntersecting&&!ran){ran=1;setTimeout(finale,1200)}}),{threshold:.6}).observe($('#stage'));
rep.onclick=()=>{lns.forEach(l=>l.classList.remove('on'));hrt.classList.remove('on');rep.classList.remove('on');setTimeout(finale,800)};

/* sky: stars + petals */
const cv=$('#sky'),cx=cv.getContext('2d');let W,H,boost=0,stars=[],pets=[];
function size(){const d=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*d;H=cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);W=innerWidth;H=innerHeight;
  stars=Array.from({length:Math.round(W*H/7000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.2,p:Math.random()*6}))}
size();let lw=innerWidth;addEventListener('resize',()=>{if(innerWidth!==lw){lw=innerWidth;size()}});
for(let i=0;i<(innerWidth<700?9:18);i++)pets.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:Math.random()*.4-.2,vy:-(.25+Math.random()*.4),s:7+Math.random()*9,r:Math.random()*6,life:1e9,amb:1,h:1});
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
(function draw(t){
  if(document.hidden){requestAnimationFrame(draw);return}
  cx.clearRect(0,0,W,H);
  const g=cx.createRadialGradient(W/2,H*1.1,0,W/2,H*1.1,H*1.2);g.addColorStop(0,'rgba(255,190,205,.5)');g.addColorStop(1,'rgba(255,244,239,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H);
  for(const s of stars){const a=.35+.45*Math.sin(t/1200*(1+boost*1.5)+s.p);cx.fillStyle=`rgba(232,140,165,${a})`;cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill()}
  if(!reduce)for(let i=pets.length-1;i>=0;i--){const p=pets[i];p.x+=p.vx+Math.sin(t/900+p.r)*.25;p.y+=p.vy*(p.fall?1.6:1)+(p.fall?0:boost*.1);p.r+=.01;p.life--;
    if(p.amb&&p.y<-20){p.y=H+20;p.x=Math.random()*W}
    if(p.life<=0||p.y>H+40&&!p.amb){pets.splice(i,1);continue}
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.h?Math.sin(t/700+p.r)*.35:p.r);cx.globalAlpha=p.amb?.4:Math.min(1,p.life/40)*.85;cx.fillStyle=p.amb?'#f4a3b5':'#e06a86';if(p.h){const s=p.s;cx.beginPath();cx.moveTo(0,s*.35);cx.bezierCurveTo(-s,-s*.3,-s*.5,-s,0,-s*.4);cx.bezierCurveTo(s*.5,-s,s,-s*.3,0,s*.35);cx.fill()}else{cx.beginPath();cx.ellipse(0,0,p.s*.55,p.s,0,0,7);cx.fill()}cx.restore()}
  requestAnimationFrame(draw)})(0);
addEventListener('click',e=>{if(e.target.closest('input'))return;for(let i=0;i<5;i++)pets.push({x:e.clientX,y:e.clientY,vx:(Math.random()-.5)*3,vy:-1-Math.random()*2,s:5+Math.random()*5,r:Math.random()*6,life:70,fall:1,h:1})});
</script>
</body></html>
